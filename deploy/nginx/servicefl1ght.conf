# Домены продакшена. Почту autoconfig/autodiscover сюда не вешаю.
# HTTPS после certbot дописывается в живой файл на сервере, не в этот шаблон.

# ==========================================
# Лендинг и чат: fl1ght.ru, service.fl1ght.ru
# ==========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fl1ght.ru www.fl1ght.ru service.fl1ght.ru www.service.fl1ght.ru 159.194.243.24;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        root /opt/servicefl1ght/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# ==========================================
# Админка скаутов: admin.fl1ght.ru → FastAPI /crm
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name admin.fl1ght.ru www.admin.fl1ght.ru;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /crm {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic off;
    }

    location = / {
        return 301 /crm;
    }
}

# ==========================================
# Карточки заказов: crm.fl1ght.ru → frontend/crm.html
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name crm.fl1ght.ru www.crm.fl1ght.ru;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        root /opt/servicefl1ght/frontend;
        index crm.html;
        try_files $uri $uri/ /crm.html;
    }
}
