<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceFl1ght — Ремонт техники Apple</title>
    <style>
        body {
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7; color: #1d1d1f; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            display: flex; flex-wrap: wrap; max-width: 1000px; width: 100%; padding: 20px; gap: 40px; align-items: center;
        }
        .text-section {
            flex: 1; min-width: 300px;
        }
        .text-section h1 {
            font-size: 3rem; margin-bottom: 10px;
        }
        .text-section p {
            font-size: 1.2rem; color: #515154; line-height: 1.5;
        }
        .chat-section {
            flex: 1; min-width: 300px; background: #fff; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: 500px; overflow: hidden;
        }
        .chat-header {
            background: #fff; padding: 20px; border-bottom: 1px solid #e5e5ea; text-align: center; font-weight: bold;
        }
        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fafafa;
        }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; font-size: 0.95rem;
        }
        .bot {
            background: #e9e9eb; color: #000; align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .user {
            background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .chat-input-area {
            display: flex; padding: 15px; background: #fff; border-top: 1px solid #e5e5ea;
        }
        input[type="text"] {
            flex: 1; padding: 12px 15px; border: 1px solid #e5e5ea; border-radius: 20px; font-size: 1rem; outline: none; transition: border 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007aff;
        }
        button {
            background: #007aff; color: #fff; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.3s;
        }
        button:hover { background: #005bb5; }
        .loading {
            font-size: 0.8rem; color: #888; align-self: flex-start; display: none; margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text-section">
        <h1>Сломался iPhone?</h1>
        <p>Не трать время на звонки и поиск прайсов. Напиши, что у тебя случилось, и наш ИИ-мастер мгновенно назовет точную цену и время ремонта.</p>
    </div>

    <div class="chat-section">
        <div class="chat-header">Служба поддержки ServiceFl1ght</div>
        <div class="chat-messages" id="messages">
            <div class="message bot">Добрый день! Какое устройство нужно починить и что с ним случилось?</div>
        </div>
        <div class="loading" id="loading">ИИ печатает...</div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Например: сколько стоит замена экрана на 11?" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
            </button>
        </div>
    </div>
</div>

<script>
    // Один session_id на вкладку: API склеивает реплики клиента в одну воронку.
    let sessionId = localStorage.getItem('chat_session');
    if (!sessionId) {
        sessionId = 'web_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_session', sessionId);
    }

    const messagesDiv = document.getElementById('messages');
    const inputField = document.getElementById('userInput');
    const loadingDiv = document.getElementById('loading');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        inputField.value = '';
        loadingDiv.style.display = 'block';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, text: text })
            });

            const data = await response.json();
            loadingDiv.style.display = 'none';

            if (data.reply_text) {
                appendMessage(data.reply_text, 'bot');
            } else {
                appendMessage('Произошла ошибка при обработке ответа.', 'bot');
            }
        } catch (error) {
            loadingDiv.style.display = 'none';
            appendMessage('Сервер временно недоступен. Попробуйте позже.', 'bot');
            console.error('Error:', error);
        }
    }
</script>

</body>
</html>
